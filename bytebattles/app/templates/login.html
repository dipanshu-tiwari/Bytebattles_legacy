{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}
  <div class="flex justify-center">
    <div class="m-6 py-6 px-12 rounded-2xl bg-gray-200">
      <form action="{% url 'login' %}" method="post" class="mb-6 flex flex-col space-y-6 items-center">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <input name="username" type="text" placeholder="username" required class="px-6 py-3 bg-white rounded-xl box-border border-2 border-gray-400"/>
        <input name="password" type="password" placeholder="password" required class="px-6 py-3 bg-white rounded-xl box-border border-2 border-gray-400"/>
        <input type="submit" value="Login" class="text-lg font-semibold px-6 py-3 bg-brand text-white rounded-xl hover:bg-brand-hov transition"/>
        <p class="text-md text-gray-500 font-semibold">new user?</p>
        <a href="{% url 'register' %}" class="text-lg font-semibold px-6 py-3 bg-brand-dark text-white rounded-xl hover:bg-brand-dhov transition">Register</a>
      </form>
    </div>
  </div>
{% endblock %}
